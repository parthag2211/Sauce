kind = "web"
previewPath = "/sauce-hiring/"
title = "Sauce Hiring"
description = "Create opportunities, apply by voice, and review private evidence with human decisions. Separate from the Sauce product walkthrough."
version = "1.0.0"
id = "artifacts/sauce-hiring"
router = "path"

[[services]]
name = "web"
paths = [ "/sauce-hiring/" ]
localPort = 21828

[services.development]
run = "pnpm --filter @workspace/sauce-hiring run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sauce-hiring", "run", "build" ]
serve = "static"
publicDir = "artifacts/sauce-hiring/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21828"
BASE_PATH = "/sauce-hiring/"
